<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>감나무 한가위</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400&display=swap">
<style>
:root{
  --sky-top:#090f24;
  --sky-mid:#1a2347;
  --sky-bottom:#46456f;
  --moon:#f8e8b4;
  --moon-glow:rgba(248,232,180,.32);
  --text:#fbf3e4;
  --persimmon:#e8702a;
  --mtn-far:#2c3562;
  --mtn-mid:#232b50;
  --mtn-near:#1b2240;
  --hill:#1a2a2c;
  --hill-2:#111d1f;
}
html,body{height:100%}
body{
  margin:0;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 50%,var(--sky-bottom) 100%);
  color:var(--text);
  font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
.scene{
  position:relative;
  height:100%;
  height:100dvh;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding-inline:16px;
  padding-block:0;
  overflow:hidden;
  box-sizing:border-box;
}

/* ── 하늘 ── */
.stars{position:absolute;inset:0;pointer-events:none}
.star{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:var(--text);opacity:.5;
  animation:twinkle var(--d,4s) ease-in-out infinite;
  animation-delay:var(--delay,0s);
}
.star.big{width:3px;height:3px;box-shadow:0 0 6px var(--moon)}
.star.warm{background:#ffe6b8}.star.cool{background:#cfe0ff}
.star.spark{width:3px;height:3px;background:#fff;box-shadow:0 0 8px 1px rgba(255,255,255,.8)}
.star.spark::before,.star.spark::after{content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.star.spark::before{width:16px;height:1px}
.star.spark::after{width:1px;height:16px}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}

.milky{ /* 은하수 띠 */
  position:absolute;left:-10%;top:-20%;width:120%;height:70%;
  background:
    radial-gradient(60% 30% at 50% 50%,rgba(200,210,255,.10),transparent 70%),
    radial-gradient(18% 10% at 30% 46%,rgba(220,225,255,.10),transparent 70%),
    radial-gradient(14% 8% at 62% 54%,rgba(220,225,255,.09),transparent 70%),
    radial-gradient(10% 6% at 48% 42%,rgba(255,235,210,.08),transparent 70%),
    radial-gradient(30% 12% at 70% 50%,rgba(180,195,255,.07),transparent 70%);
  transform:rotate(-14deg);pointer-events:none;
}
.nebula{ /* 지평선 근처 옅은 보랏빛 노을 잔광 */
  position:absolute;left:0;right:0;bottom:22%;height:30%;
  background:linear-gradient(180deg,transparent,rgba(120,90,150,.14) 60%,rgba(150,110,140,.18));
  pointer-events:none;
}

.shooting{
  position:absolute;top:14%;left:12%;width:140px;height:2px;
  background:linear-gradient(90deg,rgba(255,255,255,0),#fff 60%,rgba(255,255,255,0));
  transform:rotate(22deg);opacity:0;pointer-events:none;
  animation:shoot 11s ease-out infinite 3s;
}
@keyframes shoot{
  0%{opacity:0;transform:rotate(22deg) translateX(0)}
  2%{opacity:1}
  9%{opacity:0;transform:rotate(22deg) translateX(420px)}
  100%{opacity:0;transform:rotate(22deg) translateX(420px)}
}

.moon{
  position:absolute;left:50%;top:7%;
  width:clamp(110px,min(22vw,24vh),240px);aspect-ratio:1;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle at 42% 38%,#fff9dc 0%,var(--moon) 55%,#e6cd8c 100%);
  box-shadow:0 0 40px 14px var(--moon-glow),0 0 140px 60px rgba(248,232,180,.14);
  pointer-events:none;
}
.moon::after{ /* 달 표면 얼룩 */
  content:"";position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(circle at 28% 62%,rgba(120,100,60,.09) 0 14%,transparent 15%),
    radial-gradient(circle at 64% 28%,rgba(120,100,60,.07) 0 10%,transparent 11%),
    radial-gradient(circle at 70% 70%,rgba(120,100,60,.07) 0 16%,transparent 17%);
}
.moon::before{ /* 달무리 */
  content:"";position:absolute;inset:-28%;border-radius:50%;
  border:1px solid rgba(248,232,180,.14);
  box-shadow:0 0 30px rgba(248,232,180,.08),inset 0 0 30px rgba(248,232,180,.08);
}
.moon svg{position:absolute;inset:0;width:100%;height:100%} /* 달토끼 */
.moon .rabbit,.moon .pestle,.moon .ear{transform-box:view-box}
.moon .rabbit{transform-origin:40px 78px;animation:pound-body 1.6s ease-in-out infinite}
.moon .pestle{animation:pound 1.6s infinite}
.moon .ear{animation:ear 1.6s ease-in-out infinite}
.moon .e1{transform-origin:43px 34px}
.moon .e2{transform-origin:47px 34px;animation-delay:.1s}
@keyframes pound{ /* 천천히 들었다가 탁 내려찧기 */
  0%{transform:translateY(-7px);animation-timing-function:ease-out}
  55%{transform:translateY(-7px);animation-timing-function:cubic-bezier(.6,0,1,.4)}
  70%{transform:translateY(0);animation-timing-function:ease-in-out}
  78%{transform:translateY(0)}
  100%{transform:translateY(-7px)}
}
@keyframes pound-body{
  0%,55%{transform:rotate(-2deg)}
  70%,78%{transform:rotate(2deg) translateY(.6px)}
  100%{transform:rotate(-2deg)}
}
@keyframes ear{
  0%,55%{transform:rotate(0)}
  70%{transform:rotate(-8deg)}
  85%,100%{transform:rotate(0)}
}

.cloud{
  position:absolute;height:clamp(34px,7vh,70px);width:clamp(200px,32vw,460px);
  border-radius:100px;
  background:
    radial-gradient(ellipse 22% 60% at 22% 70%,rgba(230,225,255,.6),transparent 70%),
    radial-gradient(ellipse 18% 75% at 40% 45%,rgba(230,225,255,.65),transparent 70%),
    radial-gradient(ellipse 24% 65% at 60% 60%,rgba(230,225,255,.55),transparent 70%),
    radial-gradient(ellipse 16% 50% at 78% 72%,rgba(230,225,255,.5),transparent 70%),
    radial-gradient(ellipse 45% 30% at 50% 85%,rgba(230,225,255,.4),transparent 70%);
  filter:blur(6px);opacity:.3;pointer-events:none;
  animation:drift var(--t,90s) linear infinite;
}
.cloud.c1{top:14%;--t:110s}
.cloud.c2{top:26%;--t:150s;animation-delay:-60s;opacity:.18}
@keyframes drift{from{left:-35%}to{left:105%}}

/* ── 기러기 떼 ── */
.geese{
  position:absolute;top:22%;left:-20%;width:clamp(120px,14vw,220px);height:auto;
  opacity:.75;pointer-events:none;
  animation:migrate 48s linear infinite 6s;
}
.geese path{transform-box:fill-box;transform-origin:50% 100%;animation:flap .9s ease-in-out infinite}
.geese path:nth-child(2n){animation-delay:-.3s}
.geese path:nth-child(3n){animation-delay:-.6s}
@keyframes migrate{from{left:-20%;top:24%}to{left:105%;top:14%}}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.25)}}

/* ── 먼 산 ── */
.mountains{
  position:absolute;left:0;right:0;bottom:clamp(70px,14vh,140px);
  height:clamp(90px,24vh,240px);pointer-events:none;
}
.mountains svg{display:block;width:100%;height:100%}

/* ── 무대 ── */
.stage{
  position:relative;z-index:2;
  width:100%;max-width:1180px;margin:0 auto;
  display:grid;
  grid-template-columns:minmax(150px,1fr) minmax(0,1.6fr) minmax(150px,1fr);
  align-items:end;
  gap:24px;
  padding-bottom:clamp(56px,11vh,110px); /* 언덕 위에 서도록 */
}
.tree{display:block;width:100%;max-width:min(440px,42vh);margin:0;justify-self:center;
  transform-origin:50% 100%;
  animation:sway 7s ease-in-out infinite;
}
.tree.right{transform:scaleX(-1);animation-name:sway-r;animation-delay:-3s}
.tree svg{display:block;width:100%;height:auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
@keyframes sway{0%,100%{rotate:-.6deg}50%{rotate:.6deg}}
@keyframes sway-r{0%,100%{transform:scaleX(-1) rotate(.6deg)}50%{transform:scaleX(-1) rotate(-.6deg)}}

.greeting{
  text-align:center;
  align-self:center;
  padding-block:0 clamp(8px,4vh,40px);
  translate:0 clamp(-44px,-5vh,-16px); /* 나무 사이 중앙보다 조금 위로 */
}
.eyebrow{
  margin:0 0 18px;
  font-size:.85rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--text);font-weight:400;
  -webkit-text-stroke:1px #000;
  paint-order:stroke fill;
  text-shadow:1px 1px 0 #000,-1px -1px 0 #000;
}
.eyebrow::before,.eyebrow::after{content:"—";margin:0 .6em;opacity:.6}
h1{
  margin:0;
  font-family:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  font-weight:700;
  font-size:clamp(1.9rem,min(5.4vw,7vh),4.4rem);
  line-height:1.3;
  letter-spacing:-.01em;
  text-wrap:balance;word-break:keep-all;
  /* 검정 테두리: stroke를 글자 뒤에 그려 획이 얇아지지 않도록 */
  -webkit-text-stroke:clamp(2px,.28vw,4px) #000;
  paint-order:stroke fill;
  text-shadow:
    1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000,
    0 0 24px rgba(248,232,180,.35),0 3px 6px rgba(0,0,0,.45);
}
h1 em{font-style:normal;color:#ffd08a}
.sub{
  margin:clamp(10px,2.4vh,22px) auto 0;max-width:30ch;word-break:keep-all;
  font-size:clamp(.95rem,1.4vw,1.15rem);
  line-height:1.8;font-weight:400;color:var(--text);
  -webkit-text-stroke:1.5px #000;
  paint-order:stroke fill;
  text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;
}
.sub b{font-weight:400;color:var(--text)}

/* ── 땅 ── */
.ground{
  position:absolute;left:0;right:0;bottom:0;height:clamp(80px,16vh,160px);
  pointer-events:none;z-index:1;
}
.ground .hills{position:absolute;inset:0;width:100%;height:100%}
.ground .props{position:absolute;left:0;right:0;bottom:0;height:100%;width:100%}
.hanok{
  position:absolute;right:20%;bottom:46%;
  width:clamp(200px,26vw,380px);height:auto;overflow:visible;
}
.hanok .win{animation:lamp 3s ease-in-out infinite}
@keyframes lamp{0%,100%{opacity:.85}50%{opacity:1}}
.hanok .smoke circle{transform-box:fill-box;transform-origin:center;animation:smoke 4.5s ease-out infinite;opacity:0}
.hanok .smoke circle:nth-child(2){animation-delay:-1.5s}
.hanok .smoke circle:nth-child(3){animation-delay:-3s}
@keyframes smoke{
  0%{transform:translate(0,14px) scale(.5);opacity:0}
  20%{opacity:.35}
  100%{transform:translate(8px,-22px) scale(1.6);opacity:0}
}
.hanok .lantern{transform-box:view-box;transform-origin:214px 58px;animation:swing 3.4s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.hanok .gotgam{transform-box:view-box;transform-origin:64px 52px;animation:swing 4s ease-in-out infinite -1s}
.grass{
  position:absolute;left:0;right:0;bottom:0;height:46%;
  display:flex;justify-content:space-between;align-items:flex-end;
  padding-inline:2%;
}
.grass svg{height:100%;width:auto;transform-origin:50% 100%;animation:rustle 4s ease-in-out infinite}
.grass svg:nth-child(2n){animation-delay:-1.3s}
.grass svg:nth-child(3n){animation-delay:-2.6s;height:80%}
@keyframes rustle{0%,100%{transform:skewX(-3deg)}50%{transform:skewX(3deg)}}

/* ── 떨어지는 감 ── */
.drops{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.drop{
  position:absolute;overflow:visible;
  animation:fall 2.4s forwards;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,.4));
}
@keyframes fall{
  0%  {transform:translateY(0) rotate(0);opacity:1;animation-timing-function:cubic-bezier(.5,0,1,.6)}
  62% {transform:translateY(var(--fall)) rotate(var(--rot));animation-timing-function:cubic-bezier(0,.5,.4,1)}
  74% {transform:translateY(calc(var(--fall) - var(--bounce))) rotate(calc(var(--rot) * 1.25));animation-timing-function:cubic-bezier(.5,0,1,.6)}
  84% {transform:translateY(var(--fall)) rotate(calc(var(--rot) * 1.35));opacity:1}
  100%{transform:translateY(var(--fall)) rotate(calc(var(--rot) * 1.35));opacity:0}
}
.puff{
  position:absolute;width:10px;height:4px;border-radius:50%;
  background:rgba(200,190,160,.5);pointer-events:none;
  animation:puff .5s ease-out forwards;
}
@keyframes puff{from{transform:scale(1);opacity:.7}to{transform:scale(3.2,1.6);opacity:0}}

.fireflies{position:absolute;inset:0;pointer-events:none;z-index:3}
.fly{
  position:absolute;width:4px;height:4px;border-radius:50%;
  background:#e9f59a;box-shadow:0 0 8px 2px rgba(220,245,140,.7);
  opacity:0;
  animation:hover var(--t,9s) ease-in-out infinite;animation-delay:var(--delay,0s);
}
@keyframes hover{
  0%{opacity:0;transform:translate(0,0)}
  20%{opacity:.9}
  50%{opacity:.4;transform:translate(var(--dx,14px),-26px)}
  80%{opacity:.9}
  100%{opacity:0;transform:translate(calc(var(--dx,14px) * -.6),-52px)}
}

/* ── 세로 화면(폰·태블릿 세로): 인사말 위, 나무 두 그루 아래 ── */
@media (max-width:720px), (max-width:900px) and (orientation:portrait){
  .stage{
    grid-template-columns:1fr 1fr;
    gap:0;
    padding-bottom:clamp(40px,8vh,70px);
  }
  .greeting{grid-column:1/-1;grid-row:1;padding-block:0 8px;translate:0 clamp(-24px,-3vh,-8px)}
  .tree{grid-row:2;width:min(52vw,30vh);max-width:none} /* 칸보다 커도 되게 */
  .moon{top:3%;width:clamp(80px,min(24vw,16vh),200px)}
  .ground{height:clamp(60px,10vh,100px)}
  .mountains{bottom:clamp(50px,9vh,90px);height:clamp(70px,18vh,160px)}
  .hanok{right:auto;left:50%;translate:-50% 0;bottom:48%;width:clamp(130px,38vw,220px)} /* 두 나무 사이 */
  .grass svg:nth-child(4n+1){display:none}
  .cloud{opacity:.22}
  .shooting{width:90px}
  @keyframes shoot{
    0%{opacity:0;transform:rotate(22deg) translateX(0)}
    2%{opacity:1}
    9%{opacity:0;transform:rotate(22deg) translateX(220px)}
    100%{opacity:0;transform:rotate(22deg) translateX(220px)}
  }
}
/* 세로 화면인데 키가 작은 폰: 글씨를 줄여 달과 겹치지 않게 */
@media (max-width:720px) and (max-height:700px){
  .eyebrow{margin-bottom:8px;font-size:.75rem}
  h1{font-size:clamp(1.5rem,6.5vw,1.9rem)}
  .sub{font-size:.85rem;line-height:1.6;margin-top:8px}
  .greeting{translate:0 0}
  .tree{width:min(52vw,26vh)}
}
/* 가로로 눕힌 폰: 높이가 낮으니 전체를 납작하게 */
@media (min-width:721px) and (max-height:500px){
  .moon{top:3%;width:clamp(70px,22vh,110px)}
  .eyebrow{margin-bottom:6px;font-size:.7rem}
  h1{font-size:clamp(1.3rem,7vh,1.8rem);line-height:1.25}
  .sub{font-size:.8rem;line-height:1.5;margin-top:6px}
  .greeting{translate:0 0;align-self:end;padding-bottom:0}
  .stage{padding-bottom:clamp(30px,10vh,56px)}
  .tree{max-width:min(440px,46vh)}
  .ground{height:clamp(50px,16vh,80px)}
  .mountains{bottom:clamp(40px,12vh,70px);height:clamp(60px,22vh,120px)}
  .hanok{right:10%;bottom:44%;width:clamp(140px,20vw,200px)}
  .geese{top:12%}
}
@media (prefers-reduced-motion:reduce){
  .tree,.star,.cloud,.shooting,.fly,.grass svg,.hanok .win,.hanok .smoke circle,.hanok .lantern,.hanok .gotgam,.geese,.geese path,.moon .rabbit,.moon .pestle,.moon .ear{animation:none}
  .fly{opacity:.6}
  .geese{left:60%;top:16%}
}
</style>
</head>
<body>
<div class="scene">
  <div class="milky" aria-hidden="true"></div>
  <div class="nebula" aria-hidden="true"></div>
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="shooting" aria-hidden="true"></div>
  <div class="cloud c1" aria-hidden="true"></div>
  <div class="cloud c2" aria-hidden="true"></div>

  <div class="moon" aria-hidden="true">
    <!-- 떡방아 찧는 달토끼: 옆모습, 오른쪽을 보고 서서 절구질 -->
    <svg viewBox="0 0 100 100">
      <g fill="#8a7648" opacity=".24">
        <g class="rabbit">
          <circle cx="34" cy="66" r="12"/>                                  <!-- 뒷다리 허벅지 -->
          <ellipse cx="40" cy="55" rx="9" ry="15" transform="rotate(-18 40 55)"/> <!-- 몸통 -->
          <circle cx="26" cy="70" r="3.4"/>                                 <!-- 꼬리 -->
          <ellipse cx="40" cy="78" rx="9" ry="3"/>                          <!-- 뒷발 -->
          <circle cx="47" cy="39" r="7.5"/>                                 <!-- 머리 -->
          <circle cx="53" cy="41.5" r="3.2"/>                               <!-- 주둥이 -->
          <g class="ear e1"><ellipse cx="41" cy="26" rx="2.7" ry="10" transform="rotate(-28 41 26)"/></g>
          <g class="ear e2"><ellipse cx="47" cy="25" rx="2.7" ry="10" transform="rotate(-8 47 25)"/></g>
        </g>
        <g class="pestle">
          <rect x="60" y="30" width="4.5" height="34" rx="2.2"/>            <!-- 절굿공이 -->
          <rect x="57" y="27" width="10.5" height="6" rx="2.5"/>
          <ellipse cx="54" cy="50" rx="10.5" ry="3.2" transform="rotate(-10 54 50)"/> <!-- 앞발 -->
        </g>
        <path d="M53 63 h19 l-2.5 15 h-14z"/>                                <!-- 절구 -->
        <rect x="51.5" y="61" width="22" height="3.5" rx="1.2"/>
      </g>
    </svg>
  </div>

  <!-- 남쪽으로 가는 기러기 -->
  <svg class="geese" viewBox="0 0 200 60" aria-hidden="true" fill="none" stroke="#dfe4f5" stroke-width="1.6" stroke-linecap="round">
    <path d="M100 8 Q106 2 112 8 M100 8 Q94 2 88 8"/>
    <path d="M84 16 Q89 11 94 16 M84 16 Q79 11 74 16"/>
    <path d="M116 16 Q121 11 126 16 M116 16 Q111 11 106 16"/>
    <path d="M68 24 Q73 19 78 24 M68 24 Q63 19 58 24"/>
    <path d="M132 24 Q137 19 142 24 M132 24 Q127 19 122 24"/>
    <path d="M52 32 Q57 27 62 32 M52 32 Q47 27 42 32"/>
    <path d="M148 32 Q153 27 158 32 M148 32 Q143 27 138 32"/>
    <path d="M36 40 Q41 35 46 40 M36 40 Q31 35 26 40"/>
    <path d="M164 41 Q169 36 174 41 M164 41 Q159 36 154 41"/>
  </svg>

  <div class="mountains" aria-hidden="true">
    <svg viewBox="0 0 1200 240" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4478"/><stop offset="1" stop-color="#2c3562"/>
        </linearGradient>
        <linearGradient id="fog1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8d9ad0" stop-opacity="0"/><stop offset=".5" stop-color="#8d9ad0" stop-opacity=".22"/><stop offset="1" stop-color="#8d9ad0" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="fog2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7c88bd" stop-opacity="0"/><stop offset=".55" stop-color="#7c88bd" stop-opacity=".28"/><stop offset="1" stop-color="#7c88bd" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <!-- 가장 먼 산 -->
      <path d="M0 150 L90 100 L170 130 L260 60 L340 110 L420 80 L520 140 L620 70 L700 120 L780 90 L880 150 L960 95 L1040 130 L1120 85 L1200 120 L1200 240 L0 240Z" fill="url(#mist)"/>
      <path d="M0 150 L90 100 L170 130 L260 60 L340 110 L420 80 L520 140 L620 70 L700 120 L780 90 L880 150 L960 95 L1040 130 L1120 85 L1200 120" fill="none" stroke="#6f7bb0" stroke-width="1.5" stroke-opacity=".55"/>
      <rect x="0" y="120" width="1200" height="60" fill="url(#fog1)"/>

<script>
(function(){
  var stars=document.getElementById('stars');
  var frag=document.createDocumentFragment();
  for(var i=0;i<110;i++){
    var s=document.createElement('span');
    var r=Math.random();
    s.className='star'+(r<.05?' spark':r<.18?' big':r<.3?' warm':r<.42?' cool':'');
    s.style.left=(Math.random()*100).toFixed(2)+'%';
    s.style.top=(Math.random()*60).toFixed(2)+'%';
    s.style.setProperty('--d',(3+Math.random()*4).toFixed(2)+'s');
    s.style.setProperty('--delay',(-Math.random()*6).toFixed(2)+'s');
    frag.appendChild(s);
  }
  stars.appendChild(frag);

  var flies=document.getElementById('fireflies');
  var f2=document.createDocumentFragment();
  for(var j=0;j<16;j++){
    var f=document.createElement('span');
    f.className='fly';
    // 나무와 풀숲 주변(화면 아래쪽)에만
    var left=Math.random()<.5?Math.random()*30:70+Math.random()*30;
    f.style.left=left.toFixed(2)+'%';
    f.style.top=(58+Math.random()*32).toFixed(2)+'%';
    f.style.setProperty('--t',(7+Math.random()*6).toFixed(2)+'s');
    f.style.setProperty('--delay',(-Math.random()*10).toFixed(2)+'s');
    f.style.setProperty('--dx',((Math.random()-.5)*40).toFixed(0)+'px');
    f2.appendChild(f);
  }
  flies.appendChild(f2);

  /* 감 떨어지기: 두 나무에서 번갈아 한 알씩 */
  var drops=document.getElementById('drops');
  var trees=document.querySelectorAll('.tree svg');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)');
  var SVG='http://www.w3.org/2000/svg', XL='http://www.w3.org/1999/xlink';
  function dropOne(){
    if(reduce.matches||document.hidden||!trees.length) return;
    var tree=trees[Math.floor(Math.random()*trees.length)];
    var r=tree.getBoundingClientRect();
    if(r.width<20) return;
    var unit=r.width/320;                     // 심볼 좌표 1단위 = 몇 px
    var size=44*unit;
    var x=r.left+(60+Math.random()*200)*unit; // 잎 덩어리 안쪽
    var y=r.top+(60+Math.random()*150)*unit;
    var groundY=r.top+426*unit;               // 나무 밑동 높이
    var el=document.createElementNS(SVG,'svg');
    el.setAttribute('class','drop');
    el.setAttribute('viewBox','-22 -24 44 44');
    el.style.width=el.style.height=size+'px';
    el.style.left=(x-size/2)+'px';
    el.style.top=(y-size/2)+'px';
    el.style.setProperty('--fall',(groundY-y)+'px');
    el.style.setProperty('--bounce',(8+Math.random()*10)*unit+'px');
    el.style.setProperty('--rot',((Math.random()<.5?-1:1)*(120+Math.random()*160)).toFixed(0)+'deg');
    var use=document.createElementNS(SVG,'use');
    use.setAttribute('href','#fruit');
    use.setAttributeNS(XL,'xlink:href','#fruit');
    el.appendChild(use);
    drops.appendChild(el);
    // 땅에 닿을 때 흙먼지
    setTimeout(function(){
      var pf=document.createElement('span');
      pf.className='puff';
      pf.style.left=(x-5)+'px';
      pf.style.top=(groundY+6*unit)+'px';
      drops.appendChild(pf);
      pf.addEventListener('animationend',function(){pf.remove();});
    },2400*.62);
    el.addEventListener('animationend',function(){el.remove();});
  }
  function schedule(){
    setTimeout(function(){dropOne();schedule();},2200+Math.random()*3000);
  }
  setTimeout(function(){dropOne();schedule();},1500);
})();
</script>
